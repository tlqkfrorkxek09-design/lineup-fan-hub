            const [isLocked, setIsLocked] = useState(true);
            const [pinInput, setPinInput] = useState('');

                email: 'guest@lineup.hub',
                nickname: '방문자',
                role: 'guest', // guest, user, admin, super_admin
                profileImage: '',
                warningCount: 0,
                seenNoticeIds: [],
                language: 'KR',
                profileUpdatedAt: null
            });

            const [notices, setNotices] = useState([
                { id: 1, title: 'LINEUP HUB 오픈 안내', content: '라인업 팬 허브가 정식 오픈되었습니다. 공지사항을 반드시 숙지해 주세요.', images: [], isNotice: true, date: '2026-11-09' }
            ]);

                { id: 2, title: '공식 유튜브', url: 'https://youtube.com', is_active: true, order: 2 },
                { id: 3, title: '공식 틱톡', url: 'https://tiktok.com', is_active: true, order: 3 },
                { id: 4, title: '공식 X (트위터)', url: 'https://x.com', is_active: true, order: 4 },
                { id: 5, title: '본방 라이브', url: 'https://soop.co.kr', is_active: true, order: 5 },
                { id: 6, title: '투네이션 후원', url: 'https://toon.at', is_active: true, order: 6 },
            ]);

            const [notifications, setNotifications] = useState([
                { id: 1, recipient_email: 'ALL', type: 'notice', title: '환영합니다!', message: 'LINEUP HUB에 오신 것을 환영합니다.', link: '', read: false }
            ]);

            const [activePopupNotice, setActivePopupNotice] = useState(null);
            const [popupChecked, setPopupChecked] = useState(false);

            // 초기 팝업 체크
            useEffect(() => {
                if (notices.length > 0) {
                    const unread = notices.find(n => n.isNotice && !user.seenNoticeIds.includes(n.id));
                    if (unread) {
                        setActivePopupNotice(unread);
                        setPopupChecked(false);
                    }
                }
            }, [notices]);

            // PIN 잠금 해제 처리
            const handlePinPress = (num) => {
                const nextPin = pinInput + num;
                if (nextPin.length === 4) {
                    if (nextPin === '0614') {
                        setIsLocked(false);
                    } else {
                        alert('PIN 번호가 틀렸습니다. (기본: 0614)');
                        setPinInput('');
                    }
                } else {
                    setPinInput(nextPin);
                }
            };

                            </div>

                                        key={idx}
                                        onClick={() => {
                                            if (btn === 'C') setPinInput('');
                                            else if (btn === '←') setPinInput(prev => prev.slice(0, -1));
                                            else handlePinPress(String(btn));
                                        }}
                                        className="h-14 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl text-xl font-semibold transition-colors flex items-center justify-center"

                                    </button>
                                ))}
                            </div>

                                <option value="EN">🇺🇸 EN</option>
                                <option value="CN">🇨🇳 CN</option>
                                <option value="JP">🇯🇵 JP</option>
                                <option value="ES">🇪🇸 ES</option>
                            </select>

                                onClick={() => setUser(prev => ({ ...prev, role: prev.role === 'super_admin' ? 'user' : 'super_admin' }))}

                                {user.role === 'super_admin' ? '👑 마스터' : '👤 회원'}
                            </button>

                    <main className="flex-1 p-4 overflow-y-auto">
                        {currentTab === 'home' && (
                            <div className="space-y-6">
                                {/* 공식 홈페이지 바로가기 */}

                                    target="_blank" 
                                    rel="noreferrer"

                                    {t('officialWebsite')} ➔
                                </a>

                                {/* 공지사항 섹션 */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-sm font-bold flex items-center gap-2">
                                            <span>📢</span> {t('noticeBoard')}
                                        </h2>
                                        {user.role === 'super_admin' && (
                                            <button 
                                                onClick={() => {
                                                    const title = prompt('공지 제목을 입력하세요:');
                                                    if (!title) return;
                                                    const content = prompt('공지 내용을 입력하세요:');
                                                    if (!content) return;
                                                    const newN = { id: Date.now(), title, content, images: [], isNotice: true, date: new Date().toISOString().slice(0, 10) };
                                                    setNotices([newN, ...notices]);
                                                    setActivePopupNotice(newN);
                                                    setPopupChecked(false);
                                                }}
                                                className="text-xs bg-rose-500 text-white px-2.5 py-1 rounded-lg font-medium"
                                            >
                                                게시글 작성
                                            </button>
                                        )}
                                    </div>
                                    <p className="text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800/60 leading-relaxed mb-3">
                                        {t('noticeDisclaimer')}
                                    </p>
                                    <div className="space-y-2">
                                        {notices.slice(0, 3).map(n => (
                                            <div key={n.id} onClick={() => { setActivePopupNotice(n); setPopupChecked(true); }} className="p-3 bg-slate-950/60 rounded-xl border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-colors">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-xs font-bold text-rose-400 truncate">{n.title}</span>
                                                    <span className="text-[10px] text-slate-500">{n.date}</span>
                                                </div>
                                                <p className="text-xs text-slate-300 line-clamp-1">{n.content}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 공식 링크 6개 */}
                                <div>
                                    <h3 className="text-xs font-semibold text-slate-400 mb-3 px-1">공식 링크 및 채널</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {appLinks.filter(l => l.is_active).map(link => (
                                            <a 
                                                key={link.id} 
                                                href={link.url} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="p-3.5 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs font-semibold hover:border-rose-500/50 hover:bg-slate-850 transition-all flex items-center justify-center gap-2"
                                            >
                                                <span>🔗</span>
                                                <span className="truncate">{link.title}</span>
                                            </a>
                                        ))}
                                    </div>
                                </div>

                                {/* 하단 법적 고지 및 주의사항 */}
                                <div className="text-center space-y-2 pt-4 border-t border-slate-900">
                                    <p className="text-[11px] text-slate-500">🛡️ {t('warningNotice')}</p>
                                    <p className="text-[10px] text-slate-600 leading-relaxed">{t('legalDisclaimer')}</p>
                                </div>
                            </div>
                        )}

                        {currentTab === 'promise' && (
                            <div className="text-center py-12">
                                <div className="text-4xl mb-3">📅</div>
                                <h3 className="text-base font-bold mb-1">공지사항 & 멤버 공약표</h3>
                                <p className="text-xs text-slate-400">준비된 공약 및 일정 내역이 여기에 표시됩니다.</p>
                            </div>
                        )}

                        {currentTab === 'archive' && (
                            <div className="text-center py-12">
                                <div className="text-4xl mb-3">📂</div>
                                <h3 className="text-base font-bold mb-1">팬 아카이브</h3>
                                <p className="text-xs text-slate-400">업로드된 방송 및 미디어 아카이브 공간입니다.</p>
                            </div>
                        )}

                        {currentTab === 'inquiry' && (
                            <div className="text-center py-12">
                                <div className="text-4xl mb-3">💬</div>
                                <h3 className="text-base font-bold mb-1">1:1 문의</h3>
                                <p className="text-xs text-slate-400">관리진에게 궁금한 점을 문의하세요.</p>
                            </div>
                        )}

                        {currentTab === 'settings' && (
                            <div className="space-y-4">
                                <h3 className="text-base font-bold">내 정보 및 설정</h3>
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 mb-1 block">닉네임</label>
                                        <input 
                                            type="text" 
                                            value={user.nickname} 
                                            onChange={(e) => setUser({...user, nickname: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 mb-1 block">이메일 계정</label>
                                        <input 
                                            type="text" 
                                            disabled 
                                            value={user.email} 
                                            className="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-500 cursor-not-allowed"
                                        />
                                    </div>
                                    {user.role === 'super_admin' && (
                                        <button 
                                            onClick={() => setCurrentTab('admin')}
                                            className="w-full py-3 bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-500/20"
                                        >
                                            관리자 대시보드 열기 ⚙️
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {currentTab === 'admin' && user.role === 'super_admin' && (
                            <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-base font-bold text-rose-400">관리자 대시보드 (11모듈 통합)</h3>
                                    <button onClick={() => setCurrentTab('home')} className="text-xs bg-slate-800 px-3 py-1 rounded-lg">돌아가기</button>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                                    <p className="text-xs text-slate-300">총괄관리자 권한으로 전체 시스템 및 11개 서브 모듈을 관리합니다.</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['신청관리', '문의답변', '공약관리', '멤버링크', '관리자단톡', '공식링크', '게시판관리', '사용자목록', '삭제신청', '신고접수', '관리자승인'].map((m, idx) => (
                                            <div key={idx} className="p-3 bg-slate-950 border border-slate-800/80 rounded-xl text-xs font-medium text-center text-slate-300 hover:border-rose-500 transition-colors">
                                                {idx + 1}. {m}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 공지사항 팝업 모달 */}
                    {activePopupNotice && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl animate-in fade-in zoom-in duration-200">
                                <h3 className="text-base font-bold text-rose-400">📢 {activePopupNotice.title}</h3>
                                <div className="max-h-60 overflow-y-auto text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                                    {activePopupNotice.content}
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer pt-2">
                                    <input 
                                        type="checkbox" 
                                        checked={popupChecked} 
                                        onChange={(e) => setPopupChecked(e.target.checked)}
                                        className="w-4 h-4 rounded border-slate-700 bg-slate-950 text-rose-500 focus:ring-0"
                                    />
                                    <span className="text-xs text-slate-300 font-medium">{t('confirmChecked')}</span>
                                </label>
                                <button 
                                    disabled={!popupChecked}
                                    onClick={() => {
                                        setUser(prev => ({ ...prev, seenNoticeIds: [...prev.seenNoticeIds, activePopupNotice.id] }));
                                        setActivePopupNotice(null);
                                    }}
                                    className={`w-full py-3 rounded-xl text-xs font-bold transition-all ${popupChecked ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/20' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                >
                                    {t('close')}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 하단 고정 탭 바 */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-900 px-2 py-2 flex justify-around items-center z-40">
                        {[
                            { id: 'home', icon: '🏠', label: t('home') },
                            { id: 'promise', icon: '📅', label: t('promise') },
                            { id: 'archive', icon: '📂', label: t('archive') },
                            { id: 'inquiry', icon: '💬', label: t('inquiry') },
                            { id: 'settings', icon: '⚙️', label: t('settings') }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setCurrentTab(tab.id)}
                                className={`flex flex-col items-center justify-center w-16 py-1 rounded-xl transition-colors ${currentTab === tab.id ? 'text-rose-500 font-bold' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <span className="text-lg mb-0.5">{tab.icon}</span>
                                <span className="text-[10px]">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
