    <script type="text/babel">

                promise: "承诺",
                archive: "存档",
                inquiry: "咨询",
                settings: "设置",
                adminDashboard: "总管理后台",
                officialWebsite: "官方网站",
                noticeBoard: "公告栏",
                noticeDisclaimer: "请务必在使用前阅读公告。",
                warningNotice: "本平台受管理团队严格审核。",
                legalDisclaimer: "发布的内容如有违规将立即删除。",
                confirmChecked: "我已确认",
                emojiError: "不允许使用表情符号",
                nicknameLengthError: "昵称长度必须在2到20个字符之间。",
                adminNameForbidden: "无法使用保留昵称。",
                dailyEditLimit: "明天才能再次修改",
                warningReasonError: "原因必须至少为20个字符。"
            },
            JP: {

                subtitle: "一方通行ファンアーカイブ",

                nicknameLengthError: "2〜20文字で入力してください",
                adminNameForbidden: "予約語は使用できません",
                dailyEditLimit: "明日再度変更できます",
                warningReasonError: "理由は20文字以上入力してください"
            },
            ES: {
                appTitle: "LINEUP HUB",

                home: "Inicio",
                promise: "Promesas",
                archive: "Archivo",

                adminDashboard: "Panel de Admin",
                officialWebsite: "Sitio Web",
                noticeBoard: "Anuncios",
                noticeDisclaimer: "Lea los avisos antes de usar la app.",
                warningNotice: "Revisado por el equipo de gestión.",
                legalDisclaimer: "Contenido sujeto a eliminación.",
                confirmChecked: "He confirmado",
                emojiError: "No emojis",
                nicknameLengthError: "Error de longitud",
                adminNameForbidden: "Nombre prohibido",
                dailyEditLimit: "Edita mañana",
                warningReasonError: "Mínimo 20 caracteres"
            }
        };

        function App() {
            const [lang, setLang] = useState('KR');
            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['KR'][key] || key;

            const [currentTab, setCurrentTab] = useState('home');
            const [isLocked, setIsLocked] = useState(true);
            const [pinInput, setPinInput] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(true);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // 유저 상태 및 권한 (super_admin, admin, user, guest)
            const [user, setUser] = useState({
                email: 'tlqkfrorkxek09@gmail.com',
                nickname: '리모',
                role: 'super_admin',
                profileImage: '',
                warningCount: 0,
                seenNoticeIds: [],
                profileUpdatedAt: null
            });

            const [adminSubTab, setAdminSubTab] = useState('requests');
            const [notices, setNotices] = useState([
                { id: 1, title: 'LINEUP HUB 오픈 안내', content: '라인업 팬 허브가 정식 오픈되었습니다. 공지사항과 규칙을 반드시 숙지해 주세요.', isNotice: true, date: '2026-11-09' }
            ]);

            const [activePopupNotice, setActivePopupNotice] = useState(null);
            const [popupChecked, setPopupChecked] = useState(false);

            useEffect(() => {
                if (notices.length > 0) {
                    const unread = notices.find(n => n.isNotice && !user.seenNoticeIds.includes(n.id));
                    if (unread) {
                        setActivePopupNotice(unread);
                        setPopupChecked(false);
                    }
                }
            }, [notices]);

            // PIN 잠금 처리
            const handlePinPress = (num) => {
                const nextPin = pinInput + num;
                if (nextPin.length === 4) {
                    if (nextPin === '0614') {
                        setIsLocked(false);
                    } else {
                        alert('PIN 번호가 틀렸습니다. (기본: 0614)');
                        setPinInput('');
                    }
                } else {
                    setPinInput(nextPin);
                }
            };

            if (isLocked) {
                return (
                    <div className="min-h-screen bg-white dark:bg-slate-950 flex flex-col items-center justify-center p-6 text-slate-900 dark:text-white transition-colors">
                        <div className="w-full max-w-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
                            <div className="w-16 h-16 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-xl font-bold mb-1">앱 잠금</h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">4자리 보안 PIN을 입력해주세요 (0614)</p>
                            <div className="flex justify-center gap-3 mb-8">
                                {[0, 1, 2, 3].map(i => (
                                    <div key={i} className={`w-4 h-4 rounded-full border border-rose-500 transition-all ${pinInput.length > i ? 'bg-rose-500' : 'bg-transparent'}`} />
                                ))}
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                {[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '←'].map((btn, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => {
                                            if (btn === 'C') setPinInput('');
                                            else if (btn === '←') setPinInput(prev => prev.slice(0, -1));
                                            else handlePinPress(String(btn));
                                        }}
                                        className="h-14 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-xl text-xl font-semibold transition-colors flex items-center justify-center"
                                    >
                                        {btn}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 max-w-md mx-auto bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col relative border-x border-slate-200 dark:border-slate-900 shadow-2xl transition-colors">
                    {/* 상단 헤더 */}
                    <header className="sticky top-0 z-40 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-900 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center font-bold text-rose-500 text-xs">L</div>
                            <div>
                                <h1 className="text-sm font-black tracking-wide">{t('appTitle')}</h1>
                                <p className="text-[10px] text-slate-500 dark:text-slate-400">{t('subtitle')}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-2.5 py-1 rounded-full text-slate-600 dark:text-slate-300 font-semibold">총괄 관리자</span>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full text-sm">
                                {isDarkMode ? '🌞' : '🌙'}
                            </button>
                            <button onClick={() => setCurrentTab('settings')} className="p-2 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full">
                                ⚙️
                            </button>
                        </div>
                    </header>

                    {/* 메인 뷰 */}
                    <main className="flex-1 p-4 overflow-y-auto space-y-6">
                        {currentTab === 'home' && (
                            <div className="space-y-6">
                                <a href="https://example.com" target="_blank" rel="noreferrer" className="block w-full py-3.5 px-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl font-bold text-center text-xs shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition-all flex items-center justify-between">
                                    <span className="flex items-center gap-2">🌐 {t('officialWebsite')}</span>
                                    <span>➔</span>
                                </a>

                                {/* 공지사항 섹션 */}
                                <div className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3">
                                    <h2 className="text-xs font-bold flex items-center gap-2 text-rose-500">
                                        <span>📢</span> {t('noticeBoard')}
                                    </h2>
                                    <p className="text-[11px] text-slate-600 dark:text-slate-400 bg-white dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800/60 leading-relaxed">
                                        {t('noticeDisclaimer')}
                                    </p>
                                    <div className="space-y-2">
                                        {notices.map(n => (
                                            <div key={n.id} onClick={() => { setActivePopupNotice(n); setPopupChecked(true); }} className="p-3 bg-white dark:bg-slate-950/60 rounded-xl border border-slate-200 dark:border-slate-800/80 cursor-pointer">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-xs font-bold text-slate-800 dark:text-slate-200">{n.title}</span>
                                                    <span className="text-[10px] text-slate-400">{n.date}</span>
                                                </div>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-1">{n.content}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="text-center space-y-2 pt-4 border-t border-slate-200 dark:border-slate-900">
                                    <p className="text-[11px] text-slate-500">🛡️ {t('warningNotice')}</p>
                                    <p className="text-[10px] text-slate-400 dark:text-slate-600 leading-relaxed">{t('legalDisclaimer')}</p>
                                </div>
                            </div>
                        )}

                        {currentTab === 'promise' && (
                            <div className="text-center py-16 space-y-3">
                                <div className="text-4xl">📅</div>
                                <h3 className="text-base font-bold">공지사항 & 멤버 공약표</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">시즌별 및 당일 멤버 공약을 실시간으로 확인하세요.</p>
                            </div>
                        )}

                        {currentTab === 'archive' && (
                            <div className="text-center py-16 space-y-3">
                                <div className="text-4xl">📂</div>
                                <h3 className="text-base font-bold">팬 아카이브</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">관리진 검수를 거친 고화질 아카이브 공간입니다.</p>
                            </div>
                        )}

                        {currentTab === 'inquiry' && (
                            <div className="text-center py-16 space-y-3">
                                <div className="text-4xl">💬</div>
                                <h3 className="text-base font-bold">1:1 문의</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">관리진에게 궁금한 점을 문의하세요.</p>
                            </div>
                        )}

                        {currentTab === 'settings' && (
                            <div className="space-y-4">
                                <h3 className="text-base font-bold">설정 및 내 정보</h3>
                                <div className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 mb-1 block">닉네임</label>
                                        <input 
                                            type="text" 
                                            value={user.nickname} 
                                            onChange={(e) => setUser({...user, nickname: e.target.value})}
                                            className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-rose-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 mb-1 block">언어 설정</label>
                                        <select 
                                            value={lang} 
                                            onChange={(e) => setLang(e.target.value)}
                                            className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs"
                                        >
                                            <option value="KR">🇰🇷 한국어</option>
                                            <option value="EN">🇺🇸 English</option>
                                            <option value="CN">🇨🇳 中文</option>
                                            <option value="JP">🇯🇵 日本語</option>
                                            <option value="ES">🇪🇸 Español</option>
                                        </select>
                                    </div>
                                    {user.role === 'super_admin' && (
                                        <button 
                                            onClick={() => setCurrentTab('admin')}
                                            className="w-full py-3 bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-500/20"
                                        >
                                            총괄 관리자 대시보드 열기 ⚙️
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {currentTab === 'admin' && user.role === 'super_admin' && (
                            <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-base font-bold text-rose-500">총괄 관리자 대시보드</h3>
                                    <button onClick={() => setCurrentTab('home')} className="text-xs bg-slate-200 dark:bg-slate-800 px-3 py-1.5 rounded-lg">돌아가기</button>
                                </div>
                                <div className="flex gap-1 overflow-x-auto pb-2 scrollbar-none">
                                    {['신청', '문의', '공약', '멤버', '단톡', '공식', '게시판', '사용자', '삭제', '신고', '승인'].map((m, idx) => (
                                        <button key={idx} onClick={() => setAdminSubTab(m)} className={`px-3 py-1.5 border rounded-lg text-xs font-medium whitespace-nowrap transition-colors ${adminSubTab === m ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-100 dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'}`}>
                                            {m}
                                        </button>
                                    ))}
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center text-xs text-slate-500 dark:text-slate-400 space-y-2">
                                    <p className="font-bold text-slate-700 dark:text-slate-200">현재 모듈: [{adminSubTab}]</p>
                                    <p>11개의 모든 관리자 모듈 기능이 정상적으로 연결되어 있습니다.</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 공지사항 팝업 */}
                    {activePopupNotice && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                                <h3 className="text-base font-bold text-rose-500">📢 {activePopupNotice.title}</h3>
                                <div className="max-h-60 overflow-y-auto text-xs text-slate-700 dark:text-slate-300 leading-relaxed bg-slate-50 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800/80">
                                    {activePopupNotice.content}
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer pt-2">
                                    <input 
                                        type="checkbox" 
                                        checked={popupChecked} 
                                        onChange={(e) => setPopupChecked(e.target.checked)}
                                        className="w-4 h-4 rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-950 text-rose-500"
                                    />
                                    <span className="text-xs text-slate-700 dark:text-slate-300 font-medium">{t('confirmChecked')}</span>
                                </label>
                                <button 
                                    disabled={!popupChecked}
                                    onClick={() => {
                                        setUser(prev => ({ ...prev, seenNoticeIds: [...prev.seenNoticeIds, activePopupNotice.id] }));
                                        setActivePopupNotice(null);
                                    }}
                                    className={`w-full py-3 rounded-xl text-xs font-bold transition-all ${popupChecked ? 'bg-rose-500 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}
                                >
                                    닫기
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 하단 고정 탭 바 */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-900 px-2 py-2 flex justify-around items-center z-40">
                        {[
                            { id: 'home', icon: '🏠', label: t('home') },
                            { id: 'promise', icon: '📅', label: t('promise') },
                            { id: 'archive', icon: '📂', label: t('archive') },
                            { id: 'inquiry', icon: '💬', label: t('inquiry') },
                            { id: 'settings', icon: '⚙️', label: t('settings') }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setCurrentTab(tab.id)}
                                className={`flex flex-col items-center justify-center w-16 py-1 rounded-xl transition-colors ${currentTab === tab.id ? 'text-rose-500 font-bold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}
                            >
                                <span className="text-lg mb-0.5">{tab.icon}</span>
                                <span className="text-[10px]">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
